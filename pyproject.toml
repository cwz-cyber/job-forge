[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "openhaven"
version = "0.1.0"
description = "A grounded, human-in-the-loop job application writing agent"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
openhaven = "openhaven.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

